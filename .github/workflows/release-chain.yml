name: Release Chain

on:
  push:
    branches: ["master"]
    paths:
      - "Dockerfile"
      - "secrets.Dockerfile"
      - "docker-compose.yaml"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "src/**"
      - ".github/workflows/**"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  build:
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write
    secrets: inherit
    uses: ./.github/workflows/package.yml

  deploy:
    needs: build
    secrets: inherit
    uses: ./.github/workflows/deploy.yml

  register:
    needs: deploy
    secrets: inherit
    uses: ./.github/workflows/register.yml

  unregister:
    needs: register
    secrets: inherit
    uses: ./.github/workflows/unregister.yml
